<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap');
    
    * { box-sizing: border-box; font-family: 'Prompt', sans-serif; margin: 0; padding: 0; }
    body { 
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px; 
    }
    .card { 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(16px);
      padding: 2.5rem; 
      border-radius: 20px; 
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
      width: 100%; 
      max-width: 480px; 
      text-align: center; 
    }
    h1 { font-size: 1.8rem; background: linear-gradient(to right, #38bdf8, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.5rem; }
    
    .input-group { margin-bottom: 1.2rem; text-align: left; }
    .input-group label { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 5px; display: block; }
    
    input, select { 
      width: 100%; padding: 14px; border: 2px solid #334155; border-radius: 10px; 
      background: rgba(15, 23, 42, 0.6); color: #fff; font-size: 1rem; outline: none; transition: 0.3s;
    }
    input:focus, select:focus { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
    
    button { 
      width: 100%; padding: 14px; background: linear-gradient(135deg, #3b82f6, #6366f1); 
      color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 600; 
      cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 0.5rem;
    }
    button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); }
    button:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }

    #thumbnail-box { margin-top: 1.5rem; display: none; border-radius: 12px; overflow: hidden; }
    #thumbnail-box img { width: 100%; display: block; }
    
    #status-text { margin-top: 1rem; font-size: 0.95rem; color: #38bdf8; font-weight: 600; }
    
    .dl-btn { 
      display: none; margin-top: 1.5rem; padding: 14px; 
      background: linear-gradient(135deg, #10b981, #059669); 
      color: white; text-decoration: none; border-radius: 10px; 
      font-weight: 600; font-size: 1.1rem; 
    }
    
    #error-msg { color: #f43f5e; margin-top: 1rem; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🚀 YouTube Converter Pro</h1>
    <p>ไม่มีโฆษณา • โหลดตรง • คุณภาพสูงสุด</p>
    
    <div class="input-group">
      <label>🔗 ลิงก์ YouTube (URL)</label>
      <input type="text" id="ytUrl" placeholder="https://youtu.be/...">
    </div>

    <div class="input-group">
      <label>⚙️ เลือกรูปแบบ</label>
      <select id="formatSelect">
        <option value="audio">🎵 เสียง MP3</option>
        <option value="auto">🎬 วิดีโอ MP4</option>
      </select>
    </div>

    <button onclick="startConversion()" id="convert-btn">เริ่มแปลงไฟล์</button>

    <div id="error-msg"></div>
    <div id="status-text"></div>

    <div id="thumbnail-box">
      <img id="thumb-img" src="" alt="Thumbnail">
    </div>

    <a href="#" id="download-btn" class="dl-btn" target="_blank" rel="noopener noreferrer">⬇️ ดาวน์โหลดไฟล์</a>
  </div>

  <script>
    function getYoutubeId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    async function startConversion() {
      const urlInput = document.getElementById('ytUrl').value.trim();
      const mode = document.getElementById('formatSelect').value;
      const btn = document.getElementById('convert-btn');
      const errorDiv = document.getElementById('error-msg');
      const statusDiv = document.getElementById('status-text');
      const thumbBox = document.getElementById('thumbnail-box');
      const thumbImg = document.getElementById('thumb-img');
      const dlBtn = document.getElementById('download-btn');
      
      // Reset หน้าจอ
      errorDiv.innerText = "";
      statusDiv.innerText = "";
      dlBtn.style.display = "none";
      thumbBox.style.display = "none";

      const videoId = getYoutubeId(urlInput);
      if (!videoId) {
        errorDiv.innerText = "⚠️ รูปแบบลิงก์ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง";
        return;
      }

      // แสดงปกคลิป
      thumbImg.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
      thumbBox.style.display = "block";

      btn.disabled = true;
      statusDiv.innerText = "⏳ กำลังดึงลิงก์ดาวน์โหลดจากเซิร์ฟเวอร์...";

      // รายชื่อ API Instances ที่ใช้งานได้
      const apiInstances = [
        "https://co.wuk.sh/api/json",
        "https://cobalt-api.kwiatekmoles.dev/api/json"
      ];

      let isSuccess = false;

      for (const apiUrl of apiInstances) {
        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              url: `https://www.youtube.com/watch?v=${videoId}`,
              downloadMode: mode,
              audioFormat: "mp3"
            })
          });

          if (!response.ok) continue;

          const data = await response.json();
          const downloadUrl = data.url || (data.picker && data.picker[0] ? data.picker[0].url : null);

          if (downloadUrl) {
            statusDiv.innerText = "✅ แปลงไฟล์สำเร็จ!";
            dlBtn.href = downloadUrl;
            dlBtn.style.display = "block";
            isSuccess = true;
            break;
          }
        } catch (e) {
          console.error("Instance Failed:", apiUrl);
        }
      }

      if (!isSuccess) {
        errorDiv.innerText = "❌ ไม่สามารถดึงไฟล์ได้ชั่วคราว เนื่องจากเซิร์ฟเวอร์ API หนาแน่น โปรดลองใหม่อีกครั้ง";
        statusDiv.innerText = "";
      }

      btn.disabled = false;
    }
  </script>
</body>
</html>
