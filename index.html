<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Converter</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { 
      background: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px; 
    }
    .card { 
      background: #1e293b; 
      padding: 2rem; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
      width: 100%; 
      max-width: 520px; 
      text-align: center; 
    }
    h1 { margin-bottom: 0.5rem; font-size: 1.5rem; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    input { 
      width: 100%; 
      padding: 12px; 
      border: 2px solid #334155; 
      border-radius: 8px; 
      background: #0f172a; 
      color: #fff; 
      font-size: 1rem; 
      outline: none; 
      margin-bottom: 1rem; 
    }
    input:focus { border-color: #38bdf8; }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #0284c7; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 1rem; 
      font-weight: bold; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    button:hover { background: #0369a1; }
    #result-box { 
      margin-top: 1.5rem; 
      display: none; 
      width: 100%;
    }
    /* ขยายความสูง iframe เป็น 300px เพื่อให้เห็นภาพปก ปุ่มประมวลผล และปุ่มดาวน์โหลดครบถ้วน */
    iframe { 
      width: 100%; 
      height: 300px; 
      border: none; 
      border-radius: 12px; 
      overflow: hidden; 
    }
    #error-msg { color: #ef4444; margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎵 แปลงคลิป YouTube เป็น MP3</h1>
    <p>วางลิงก์ YouTube เพื่อดาวน์โหลด MP3 คุณภาพสูง</p>
    
    <input type="text" id="ytUrl" placeholder="วางลิงก์ YouTube ที่นี่...">
    <button onclick="generateDownloadLink()">ดึงลิงก์ดาวน์โหลด</button>

    <div id="error-msg"></div>

    <div id="result-box">
      <iframe id="converter-frame" src="" scrolling="no"></iframe>
    </div>
  </div>

  <script>
    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function generateDownloadLink() {
      const urlInput = document.getElementById('ytUrl').value.trim();
      const errorDiv = document.getElementById('error-msg');
      const resultBox = document.getElementById('result-box');
      const iframe = document.getElementById('converter-frame');

      errorDiv.innerText = "";
      resultBox.style.display = "none";

      const videoId = extractVideoId(urlInput);

      if (!videoId) {
        errorDiv.innerText = "⚠️ รูปแบบลิงก์ไม่ถูกต้อง กรุณาใส่ลิงก์ YouTube ที่ถูกต้อง";
        return;
      }

      const fullYoutubeUrl = `https://www.youtube.com/watch?v=${videoId}`;
      iframe.src = `https://loader.to/api/card/?url=${encodeURIComponent(fullYoutubeUrl)}&f=mp3`;
      
      resultBox.style.display = "block";
    }
  </script>
</body>
</html>
