<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube to MP3 Converter</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 480px; text-align: center; }
    h1 { margin-bottom: 0.5rem; font-size: 1.5rem; color: #38bdf8; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    input { width: 100%; padding: 12px; border: 2px solid #334155; border-radius: 8px; background: #0f172a; color: #fff; font-size: 1rem; outline: none; margin-bottom: 1rem; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 1.5rem; font-size: 0.95rem; word-break: break-all; }
    a.dl-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #22c55e; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎵 แปลงคลิป YouTube เป็น MP3</h1>
    <p>ใส่ลิงก์คลิปที่คุณต้องการแปลงเป็นไฟล์เสียงคุณภาพสูง</p>
    
    <input type="text" id="ytUrl" placeholder="วางลิงก์ YouTube ที่นี่...">
    <button onclick="convertVideo()" id="btn">แปลงไฟล์ MP3</button>

    <div id="status"></div>
  </div>

  <script>
    async function convertVideo() {
      const urlInput = document.getElementById('ytUrl').value.trim();
      const statusDiv = document.getElementById('status');
      const btn = document.getElementById('btn');

      if (!urlInput) {
        statusDiv.innerHTML = "⚠️ กรุณากรอกลิงก์ YouTube ก่อนครับ";
        return;
      }

      // 1. ตรวจสอบและจัดการ ลิงก์ YouTube ให้เป็นรูปแบบมาตรฐาน
      let cleanUrl = urlInput;
      try {
        const parsed = new URL(urlInput);
        if (parsed.searchParams.has("v")) {
          cleanUrl = `https://www.youtube.com/watch?v=${parsed.searchParams.get("v")}`;
        } else if (parsed.hostname === "youtu.be") {
          cleanUrl = `https://www.youtube.com/watch?v=${parsed.pathname.replace('/', '')}`;
        }
      } catch (e) {
        statusDiv.innerHTML = "⚠️ ลิงก์ไม่ถูกต้อง กรุณาตรวจสอบลิงก์ YouTube อีกครั้ง";
        return;
      }

      btn.disabled = true;
      statusDiv.innerHTML = "⏳ กำลังประมวลผล ดึงไฟล์เสียง...";

      // 2. รายชื่อ Cobalt API Instances (ตัวหลัก + ตัวสำรอง)
      const apiInstances = [
        "https://api.cobalt.tools/",
        "https://cobalt-api.kwiatekmoles.dev/",
        "https://co.wuk.sh/"
      ];

      let isSuccess = false;

      // 3. วนลูปยิง API หากตัวแรกติด 400/403 จะสลับไปตัวถัดไปอัตโนมัติ
      for (const apiUrl of apiInstances) {
        try {
          const response = await fetch(apiUrl, {
            method: "POST",
            headers: {
              "Accept": "application/json",
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              url: cleanUrl,
              downloadMode: "audio",
              audioFormat: "mp3"
            })
          });

          if (!response.ok) continue; // ถ้า Error (400, 403, 500) ให้ลอง Instance ถัดไป

          const result = await response.json();

          const downloadUrl = result.url || (result.picker && result.picker[0] ? result.picker[0].url : null);

          if (downloadUrl) {
            statusDiv.innerHTML = `
              ✅ แปลงไฟล์สำเร็จ!<br><br>
              <a href="${downloadUrl}" class="dl-btn" target="_blank" rel="noopener noreferrer">ดาวน์โหลด MP3</a>
            `;
            isSuccess = true;
            break; // สำเร็จแล้ว ออกจากลูป
          }
        } catch (err) {
          console.error("Instance failed:", apiUrl, err);
        }
      }

      if (!isSuccess) {
        statusDiv.innerHTML = "❌ ไม่สามารถแปลงไฟล์ได้ โปรดตรวจสอบว่าลิงก์ถูกหรือทดลองคลิปอื่น";
      }

      btn.disabled = false;
    }
  </script>
